<!DOCTYPE html>
<html>
<head><title>Scor-Pi Icon Generator</title></head>
<body style="background:#111;padding:40px;font-family:sans-serif;color:#fff">
<h2>Scor-Pi Icon Generator</h2>
<p>Right-click each image and "Save image as..." to save the icons.</p>
<div style="display:flex;gap:40px;align-items:end;flex-wrap:wrap">
  <div>
    <h3>favicon 32x32</h3>
    <canvas id="c32" width="32" height="32" style="border:1px solid #333"></canvas>
    <br><img id="img32" style="margin-top:8px">
  </div>
  <div>
    <h3>logo192.png</h3>
    <canvas id="c192" width="192" height="192" style="border:1px solid #333"></canvas>
    <br><img id="img192" style="margin-top:8px">
  </div>
  <div>
    <h3>logo512.png</h3>
    <canvas id="c512" width="512" height="512" style="border:1px solid #333;max-width:256px"></canvas>
    <br><img id="img512" style="margin-top:8px;max-width:128px">
  </div>
</div>

<div style="margin-top:30px">
  <h3>Download Links:</h3>
  <a id="dl32" download="favicon-32x32.png" style="color:#a5f3fc;margin-right:20px">Download 32x32</a>
  <a id="dl192" download="logo192.png" style="color:#a5f3fc;margin-right:20px">Download 192x192</a>
  <a id="dl512" download="logo512.png" style="color:#a5f3fc">Download 512x512</a>
</div>

<script>
function drawLogo(canvas, size) {
  var ctx = canvas.getContext('2d');
  var s = size;
  
  // Gradient background
  var grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#6366f1');
  grad.addColorStop(1, '#8b5cf6');
  
  // Rounded rect
  var r = s * 0.19;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s-r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s-r);
  ctx.quadraticCurveTo(s, s, s-r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s-r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.fillStyle = grad;
  ctx.fill();
  
  // Pi symbol  
  ctx.strokeStyle = '#ffffff';
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(s * 0.07, 2);
  
  // Horizontal bar
  ctx.beginPath();
  ctx.moveTo(s*0.25, s*0.35);
  ctx.lineTo(s*0.75, s*0.35);
  ctx.stroke();
  
  // Left leg
  ctx.beginPath();
  ctx.moveTo(s*0.41, s*0.35);
  ctx.lineTo(s*0.41, s*0.70);
  ctx.stroke();
  
  // Right leg (curved)
  ctx.beginPath();
  ctx.moveTo(s*0.66, s*0.35);
  ctx.lineTo(s*0.66, s*0.62);
  ctx.quadraticCurveTo(s*0.66, s*0.70, s*0.58, s*0.70);
  ctx.stroke();
  
  // Circuit dots
  ctx.fillStyle = '#a5f3fc';
  var dotR = Math.max(s * 0.04, 1.5);
  
  ctx.beginPath();
  ctx.arc(s*0.25, s*0.35, dotR, 0, Math.PI*2);
  ctx.fill();
  
  ctx.beginPath();
  ctx.arc(s*0.75, s*0.35, dotR, 0, Math.PI*2);
  ctx.fill();
  
  ctx.beginPath();
  ctx.arc(s*0.41, s*0.70, dotR, 0, Math.PI*2);
  ctx.fill();

  return canvas;
}

drawLogo(document.getElementById('c32'), 32);
drawLogo(document.getElementById('c192'), 192);
drawLogo(document.getElementById('c512'), 512);

// Create download links
var url32 = document.getElementById('c32').toDataURL('image/png');
var url192 = document.getElementById('c192').toDataURL('image/png');
var url512 = document.getElementById('c512').toDataURL('image/png');

document.getElementById('img32').src = url32;
document.getElementById('img192').src = url192;
document.getElementById('img512').src = url512;

document.getElementById('dl32').href = url32;
document.getElementById('dl192').href = url192;
document.getElementById('dl512').href = url512;
</script>
</body>
</html>
